<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SICAF Móvil — Registro de Cosecha</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b4332">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f7f3ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- BARRA SUPERIOR MÓVIL -->
  <header class="bg-[#143522] text-white px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2">
      <img src="/img/logo.jpg" alt="Logo" class="w-8 h-8 rounded-full border border-amber-500">
      <span class="font-bold text-sm tracking-wide">SICAF CAMPO</span>
    </div>
    <div id="statusBadge" class="text-[11px] bg-emerald-600/90 text-white font-semibold px-2 py-0.5 rounded-full flex items-center gap-1">
      <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> Conectado
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full">

    <!-- Tarjeta Formulario -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-[#e8dfd5] mb-4">
      <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-100">
        <i class="fa-solid fa-scale-balanced text-emerald-800 text-lg"></i>
        <h2 class="text-base font-bold text-gray-800">Registrar Pesaje de Cosecha</h2>
      </div>

      <form id="formCosecha" onsubmit="guardarPesaje(event)" class="space-y-4">
        <!-- Fecha -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha</label>
          <input type="date" id="inputFecha" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm bg-gray-50 font-medium" required>
        </div>

        <!-- Campo -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Campo Cosechado (25)</label>
          <select id="selectCampo" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm bg-white font-medium" required>
            <option value="">Cargando campos...</option>
          </select>
        </div>

        <!-- Recolector (Individual) -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-gray-700">Recolector / Jornalero</label>
            <span class="text-[10px] text-amber-700 font-bold">Nómina Individual</span>
          </div>
          <select id="selectTrabajador" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm bg-white font-medium" required>
            <option value="">Cargando trabajadores...</option>
          </select>
        </div>

        <!-- Kilogramos Pesados -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Kilogramos en Báscula (kg)</label>
          <div class="relative">
            <input type="number" id="inputKg" step="0.1" min="0.1" placeholder="Ej. 45.5" class="w-full border-2 border-emerald-700 rounded-xl px-3 py-3 text-xl font-black text-emerald-900 focus:outline-none" required>
            <span class="absolute right-3 top-3 text-sm font-bold text-gray-400">KG</span>
          </div>
        </div>

        <!-- Báscula -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Punto de Pesaje / Báscula</label>
          <select id="selectBascula" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 bg-gray-50">
            <option value="Báscula #1 - Patio Central">Báscula #1 - Patio Central</option>
            <option value="Báscula #2 - Móvil Campo">Báscula #2 - Móvil Campo</option>
          </select>
        </div>

        <!-- Botón Guardar -->
        <button type="submit" class="w-full bg-[#1b4332] hover:bg-[#143522] active:scale-95 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 mt-2">
          <i class="fa-solid fa-check"></i> Guardar Pesaje
        </button>
      </form>
    </div>

    <!-- PENDIENTES DE SINCRONIZACIÓN -->
    <div id="boxOfflineSync" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 shadow-sm mb-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-amber-900 flex items-center gap-1.5">
          <i class="fa-solid fa-cloud-arrow-up text-amber-600"></i> <span id="countPendientes">0</span> registros pendientes offline
        </span>
        <button onclick="sincronizarOffline()" class="text-xs bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1 rounded-lg shadow">
          Sincronizar
        </button>
      </div>
      <p class="text-[11px] text-amber-700">Guardados en la memoria del teléfono. Se enviarán automáticamente al detectar internet.</p>
    </div>

    <!-- ÚLTIMOS PESAJES REGISTRADOS EN ESTE DISPOSITIVO -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-[#e8dfd5]">
      <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Pesajes de Hoy (Este Teléfono)</h3>
      <div id="listaPesajesLocales" class="space-y-2 text-xs divide-y divide-gray-100">
        <!-- Dinámico -->
      </div>
    </div>

  </main>

  <script>
    const STORAGE_KEY = "sicaf_offline_pesajes";
    let isOnline = navigator.onLine;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("inputFecha").value = new Date().toISOString().split("T")[0];
      actualizarEstadoRed();
      cargarMaestros();
      renderPendientes();
      renderListaLocal();

      window.addEventListener("online", () => { isOnline = true; actualizarEstadoRed(); sincronizarOffline(); });
      window.addEventListener("offline", () => { isOnline = false; actualizarEstadoRed(); });
    });

    function actualizarEstadoRed() {
      const b = document.getElementById("statusBadge");
      if (isOnline) {
        b.className = "text-[11px] bg-emerald-600 text-white font-semibold px-2 py-0.5 rounded-full flex items-center gap-1";
        b.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> Conectado';
      } else {
        b.className = "text-[11px] bg-amber-600 text-white font-semibold px-2 py-0.5 rounded-full flex items-center gap-1";
        b.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-200"></span> Modo Offline';
      }
    }

    async function cargarMaestros() {
      try {
        const [resCampos, resTrab] = await Promise.all([
          fetch("/api/campos"),
          fetch("/api/trabajadores")
        ]);
        const campos = await resCampos.json();
        const trabajadores = await resTrab.json();

        // Guardar copia local para cuando no haya red
        localStorage.setItem("sicaf_cached_campos", JSON.stringify(campos));
        localStorage.setItem("sicaf_cached_trabajadores", JSON.stringify(trabajadores));

        poblarSelects(campos, trabajadores);
      } catch (e) {
        // Cargar desde caché si no hay red
        const campos = JSON.parse(localStorage.getItem("sicaf_cached_campos") || "[]");
        const trabajadores = JSON.parse(localStorage.getItem("sicaf_cached_trabajadores") || "[]");
        poblarSelects(campos, trabajadores);
      }
    }

    function poblarSelects(campos, trabajadores) {
      const sc = document.getElementById("selectCampo");
      sc.innerHTML = '<option value="">Seleccione el campo...</option>';
      campos.forEach(c => {
        sc.innerHTML += `<option value="${c.id}">${c.codigo} - ${c.nombre} (${c.variedad})</option>`;
      });

      const st = document.getElementById("selectTrabajador");
      st.innerHTML = '<option value="">Seleccione el recolector...</option>';
      trabajadores.forEach(t => {
        st.innerHTML += `<option value="${t.id}">${t.nombre_completo} (${t.cuadrilla})</option>`;
      });
    }

    async function guardarPesaje(e) {
      e.preventDefault();

      const item = {
        clave_idempotencia: "MOVIL-" + Date.now() + "-" + Math.random().toString(36).substr(2, 6),
        fecha: document.getElementById("inputFecha").value,
        campo_id: parseInt(document.getElementById("selectCampo").value),
        trabajador_id: parseInt(document.getElementById("selectTrabajador").value),
        kg_pesados: parseFloat(document.getElementById("inputKg").value),
        bascula_id: document.getElementById("selectBascula").value,
        modalidad: "KILO",
        timestamp: new Date().toLocaleTimeString()
      };

      if (isOnline) {
        try {
          const res = await fetch("/api/cosecha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(item)
          });
          if (res.ok) {
            guardarEnHistorialLocal(item, true);
            limpiarForm();
            alert("Pesaje registrado y sincronizado en el servidor.");
            return;
          }
        } catch (err) {
          // Falla de red, guardar offline
        }
      }

      // Guardar offline
      const pendientes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      pendientes.push(item);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pendientes));

      guardarEnHistorialLocal(item, false);
      limpiarForm();
      renderPendientes();
      alert("Pesaje guardado localmente (Offline). Se enviará al reconectar.");
    }

    function limpiarForm() {
      document.getElementById("inputKg").value = "";
      document.getElementById("inputKg").focus();
    }

    function guardarEnHistorialLocal(item, synced) {
      const historial = JSON.parse(localStorage.getItem("sicaf_local_history") || "[]");
      historial.unshift({ ...item, synced });
      if (historial.length > 10) historial.pop();
      localStorage.setItem("sicaf_local_history", JSON.stringify(historial));
      renderListaLocal();
    }

    function renderListaLocal() {
      const h = JSON.parse(localStorage.getItem("sicaf_local_history") || "[]");
      const div = document.getElementById("listaPesajesLocales");
      div.innerHTML = "";
      if (h.length === 0) {
        div.innerHTML = '<p class="text-gray-400 py-2">Sin pesajes en esta sesión.</p>';
        return;
      }
      h.forEach(p => {
        div.innerHTML += `
          <div class="flex justify-between items-center py-2">
            <div>
              <p class="font-bold text-gray-800">${p.kg_pesados} kg</p>
              <p class="text-[10px] text-gray-500">${p.timestamp} • ${p.bascula_id}</p>
            </div>
            <span class="text-[10px] ${p.synced ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'} px-2 py-0.5 rounded-full font-semibold">
              ${p.synced ? 'Sincronizado' : 'Pendiente'}
            </span>
          </div>
        `;
      });
    }

    function renderPendientes() {
      const pendientes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      const box = document.getElementById("boxOfflineSync");
      if (pendientes.length > 0) {
        box.classList.remove("hidden");
        document.getElementById("countPendientes").textContent = pendientes.length;
      } else {
        box.classList.add("hidden");
      }
    }

    async function sincronizarOffline() {
      const pendientes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (pendientes.length === 0) return;

      let enviados = 0;
      const noEnviados = [];

      for (const item of pendientes) {
        try {
          const res = await fetch("/api/cosecha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(item)
          });
          if (res.ok) enviados++;
          else noEnviados.push(item);
        } catch (e) {
          noEnviados.push(item);
        }
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(noEnviados));
      renderPendientes();
      if (enviados > 0) {
        alert(`Se sincronizaron ${enviados} pesajes pendientes exitosamente.`);
      }
    }
  </script>
</body>
</html>
